[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "pytemplate"
version = "0.0.1"
description = "A python library"
dependencies = []
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
authors = [{ name = "Author", email = "author@email.com" }]

[project.scripts]
pytemplate = "pytemplate.main:main"

[dependency-groups]
dev = [
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" },
]
docs = ["sphinx~=9.1.0"]
lint = ["prek~=0.4", "ruff~=0.16", "ty~=0.0.64"]
test = ["pytest~=9.1.1", "pytest-cov~=7.1.0"]

[tool.uv]
required-version = ">=0.12.24"
default-groups = ["dev"]
# Temporary release-day catalog: uv 0.12.24 bundles only Python 3.15 release candidates.
# Remove this override once the installed uv release includes Python 3.15.0 downloads.
python-downloads-json-url = "https://raw.githubusercontent.com/astral-sh/uv/f69fb50c8b28997af9c6b0e5c700a34470d86005/crates/uv-python-managed/download-metadata.json"
# Optional: enable a dependency cooldown window if you want to avoid very recent uploads.
# exclude-newer = "7 days"

[project.urls]
Repository = "https://github.com/CQCL/pytemplate.git"

[tool.pytest.ini_options]
addopts = [
  "--cov=pytemplate",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
# Template adopters can enable CPY001 after choosing a copyright notice.
ignore = ["COM812", "CPY001", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["D100", "INP001"]
"tests/*" = ["ANN", "INP001", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
branch = true
source = ["src/pytemplate"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"
