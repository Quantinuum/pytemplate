[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[project]
name = "pytemplate"
version = "0.0.1"
description = "A python library"
dependencies = []
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Author", email = "author@email.com" }]

[project.scripts]
pytemplate = "pytemplate.main:main"

[dependency-groups]
audit = [
    "pip-audit>=2.10.0",
]
dev = [
  { include-group = "audit" },
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" },
]
docs = ["sphinx~=9.1.0"]
lint = ["prek~=0.3.1", "ruff~=0.12.12", "ty~=0.0.1a18"]
test = ["pytest~=9.0.2", "pytest-cov~=7.0.0"]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Repository = "https://github.com/CQCL/pytemplate.git"

[tool.pytest.ini_options]
addopts = [
  "--cov=pytemplate",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["D100", "INP001"]
"tests/*" = ["ANN", "INP001", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
branch = true
source = ["src/pytemplate"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"
